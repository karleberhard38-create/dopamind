<script>/* ?reset=1 setzt den Fortschritt dieses Browsers zurück (zum Testen des Starts), die Ersteller-Ansicht bleibt */
try{if(/[?&]reset=1/.test(location.search)){var o=localStorage.getItem('dm_owner');localStorage.clear();try{sessionStorage.clear();}catch(e){}if(o)localStorage.setItem('dm_owner',o);Storage.prototype.setItem=function(){};location.replace(location.pathname);}}catch(e){}</script>
<style>
/* Schriften lokal eingebunden (SIL Open Font License, siehe fonts/), keine Verbindung zu Google */
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque.woff) format('woff');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dm-sans.woff) format('woff');font-weight:100 1000;font-style:normal;font-display:swap}
a.set{text-decoration:none;color:inherit}
#onb .ob-proto{font-size:13px;line-height:1.45;color:var(--mut);background:#a78bfa1f;border:1px solid #a78bfa55;border-radius:14px;padding:11px 14px}#onb .ob-proto b{display:block;color:var(--brand);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}#onb .ob-proto i{font-style:normal;color:var(--fg);font-weight:600}
.ob-legal{font-size:12px;color:var(--dim);text-align:center}.ob-legal a{color:var(--dim)}
/* Layout: ein Handy-Rahmen mit vertikalem Karten-Feed, vier Reiter unten (Feed, Bibliothek, Entdecken, Fortschritt) */
:root{color-scheme:dark;--bg:#07070d;--panel:#13131e;--panel2:#1b1b2a;--fg:#f4f3ff;--mut:#ffffffa8;--dim:#ffffff66;--line:#ffffff1c;--brand:#a78bfa;--pink:#f472b6;--ok:#4ade80;--hd:'Bricolage Grotesque',system-ui,sans-serif;--bd:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--bd);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-size:14px}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;width:min(440px,100%);height:min(100%,860px);overflow:hidden;background:#000}
@media(min-width:600px){#app{border-radius:28px;box-shadow:0 0 90px #000}}
/* Touch-Geräte (Handy, Tablet): ganze Fläche nutzen, Handy-Rahmen nur am Computer */
@media(hover:none) and (pointer:coarse){#app{width:100%;height:100%;border-radius:0;box-shadow:none}}
@media(hover:none) and (pointer:coarse) and (min-width:700px){.tx p{max-width:720px}}

/* Feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.c{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:108px 76px 84px 24px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b),var(--c),var(--a));background-size:100% 100%;user-select:none}
.c .sh,.c .em{animation-play-state:paused}.c.cur .sh,.c.cur .em{animation-play-state:running}
@keyframes bg{50%{background-position:100% 100%}}
.art{position:relative;flex:0 0 36%;margin-right:-52px}
.sh{position:absolute;opacity:.55;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translate(10px,-18px) scale(1.15)}}
.cells .sh{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff9,var(--ac));opacity:.4}
.stars .sh{border-radius:50%;background:#fff;width:5px!important;height:5px!important;box-shadow:0 0 10px #fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.4)}}
.cubes .sh{border-radius:7px;background:linear-gradient(135deg,#fff8,var(--ac));animation:rot 9s linear infinite;opacity:.45}
@keyframes rot{to{transform:rotate(360deg) translateY(-12px)}}
.blobs .sh{border-radius:60% 40% 55% 45%;background:var(--ac);opacity:.35;animation:wob 6s ease-in-out infinite}
@keyframes wob{50%{border-radius:40% 60% 45% 55%;transform:translate(8px,-10px) rotate(40deg) scale(1.2)}}
.nodes .sh{border-radius:50%;background:var(--ac);box-shadow:0 0 18px var(--ac);opacity:.7;animation:pu 3.5s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.7);opacity:.25}}
.rings .sh{border-radius:50%;border:2px solid var(--ac);opacity:.6;animation:ring 5s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.bars .sh{border-radius:4px;background:linear-gradient(var(--ac),#fff4);opacity:.4;animation:bar 5s ease-in-out infinite;transform-origin:bottom}
@keyframes bar{50%{transform:scaleY(1.7) translateY(-6px)}}
.em{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;background:radial-gradient(circle,#ffffff2a,#ffffff08 70%);box-shadow:0 0 36px var(--ac);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) scale(1.05)}}
.tx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ac);background:#ffffff14;border:1px solid var(--ac);padding:4px 12px;border-radius:20px}
.tx p{font-family:var(--hd);font-size:clamp(19px,5.2vw,23px);line-height:1.38;font-weight:600;letter-spacing:-.012em;text-shadow:0 2px 14px #0008;text-wrap:pretty}
.meta small{display:block;color:#ffffffa0;font-size:12px;margin-top:8px}
.pips{display:flex;gap:5px}.pips i{height:4px;width:7px;border-radius:2px;background:#fff4;transition:.3s}.pips i.on{width:24px;background:var(--ac)}
.nx{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:14px;background:#0004;color:#fff;cursor:pointer;animation:nb 1.6s ease-in-out infinite}
@keyframes nb{50%{transform:translateY(-5px)}}
.prod{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#ffffffd9;font-size:12px;font-weight:600;padding:7px 12px;border-radius:20px;border:1px solid #ffffff33;background:#00000033;backdrop-filter:blur(8px)}
.prod svg{font-size:14px;color:var(--ac)}
.prod em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffffff80;border-left:1px solid #ffffff33;padding-left:8px}

/* Obere Leiste */
#top{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 14px 22px;background:linear-gradient(#000b,#0000)}
#top .r{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-family:var(--hd);font-weight:800;font-size:20px;letter-spacing:-.03em}.logo b{color:var(--brand)}
#goal{border:0;font-size:12px;font-weight:600;color:#ffffffcc;background:#ffffff1c;padding:5px 12px;border-radius:20px;cursor:pointer;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
#goal.ok{background:#4ade8033;color:var(--ok)}
#dk{padding:0 28px;text-align:center;line-height:1.3;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:#fffc}
#dk button{border:0;background:#ffffff1a;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;backdrop-filter:blur(8px);flex:none}
#dk span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#dk em{font-style:normal;color:#ffffff90;font-weight:500}
.c.off{display:none}
#feed{touch-action:pan-y}
@keyframes dsl{from{transform:translateX(var(--sx,40px));opacity:.15}to{transform:none;opacity:1}}
.c.sl{animation:dsl .26s ease-out}

/* Rechte Leiste */
#rail{position:absolute;right:8px;bottom:104px;z-index:5;display:flex;flex-direction:column;gap:14px}
#rail button{border:0;background:#0004;backdrop-filter:blur(10px);border-radius:14px;padding:8px 4px 6px;width:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
#rail button svg{font-size:23px}
#rail button small{font-size:10px;color:#ffffffb0;font-weight:600}
#rail button.pop{transform:scale(1.35)}
#rail #bl.on svg{fill:var(--pink);stroke:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}

/* Untere Navigation */
#nav{position:absolute;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;padding:8px 4px 10px;background:#000d;backdrop-filter:blur(18px);border-top:1px solid #ffffff14}
#nav button{border:0;background:none;color:var(--dim);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 10px;min-width:62px}
#nav button svg{font-size:22px}
#nav button.on{color:#fff}
#nav button.on svg{stroke:var(--brand)}

/* Ansichten */
.view{position:absolute;inset:0 0 58px;z-index:20;background:var(--bg);overflow-y:auto;padding:22px 18px 28px;display:none;overscroll-behavior:contain}
.view.show{display:block}
.view h1{font-family:var(--hd);font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
.view .sub{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:18px;max-width:34em}
.emp2{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:56px}.emp2 .eh{width:84px;height:84px;border-radius:50%;background:#fff;color:#ff5a7a;font-size:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px #3b82c433}.emp2 b{font-size:17px;color:var(--fg)}.emp2 span{max-width:280px}.emp2 .btn{margin-top:8px}
.empty{color:var(--mut);text-align:center;margin:44px 12px;line-height:1.6;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fold{border:0;text-align:left;background:var(--panel);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;aspect-ratio:3/1.4}
.mos span{display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:22px;background:var(--panel2)}
.fold b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.fold small,.sm{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
.fold .nm{min-width:0}
.tagx{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffffff99;border:1px solid #ffffff33;border-radius:10px;padding:2px 7px}
.back{border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:14px;padding:4px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#150b3a}
.btn.dng{color:#fca5a5}
.li{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;width:100%;border:0;text-align:left}
.li .e{font-size:28px}.li p{flex:1;font-size:13px;line-height:1.45;color:#ffffffd0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.li .x{color:var(--pink);font-size:20px;border:0;background:none;cursor:pointer;padding:6px}
.sec{font-family:var(--hd);font-size:16px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* Fortschritt */
.hero{display:flex;align-items:center;gap:18px;background:var(--panel);border-radius:20px;padding:18px}
.ringw{position:relative;width:112px;height:112px;flex:none}
.ringw svg{width:112px;height:112px;transform:rotate(-90deg);stroke-width:9}
.ringw .t{stroke:var(--panel2)}.ringw .p{stroke:var(--brand);transition:stroke-dasharray .8s ease}
.ringw .c2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--hd)}
.ringw .c2 b{font-size:30px;font-weight:800;line-height:1}.ringw .c2 span{font-size:11px;color:var(--mut);font-family:var(--bd)}
.stats{display:grid;gap:10px;min-width:0}
.stats div{display:flex;flex-direction:column}.stats b{font-family:var(--hd);font-size:20px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mut)}
.lvl{background:var(--panel);border-radius:16px;padding:14px;margin-top:12px}
.lvl .bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:10px 0 8px}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--pink));border-radius:5px}
.lvl small{color:var(--mut);font-size:12px;line-height:1.5;display:block}
.dk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dk .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.dk.done .dot{background:var(--ok);border-color:var(--ok);color:#052e16}
.dk span{flex:1;min-width:0}.dk small{color:var(--mut);font-variant-numeric:tabular-nums}
.lb{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);margin-bottom:8px}
.lb.me{outline:1.5px solid var(--brand)}
.lb .rk{width:20px;font-family:var(--hd);font-weight:800;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.lb .who{flex:1;min-width:0}.lb .who b{display:flex;gap:7px;align-items:center;font-size:14px}.lb .who b i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .who small{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.lb .lv{font-family:var(--hd);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:10px}

/* Sheet */
#sheet{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end}
#sheet .scrim{position:absolute;inset:0;background:#000a}
#panel{position:relative;width:100%;max-height:82%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 18px 24px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#panel h2{font-family:var(--hd);font-size:20px;font-weight:800;letter-spacing:-.02em}
#panel .hint{color:var(--mut);font-size:12.5px;line-height:1.5;margin:4px 0 14px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--panel2);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;text-align:left;font-size:14px;font-weight:600}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff44;flex:none;position:relative}
.chk.on{background:var(--pink);border-color:var(--pink)}
.chk.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #2a0a1a;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:7px;align-items:center;justify-content:center}
.seg button.on{background:#a78bfa26;border-color:var(--brand);color:#fff}
textarea.fld{height:110px;resize:none}
#toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-20px);background:#fff;color:#111;font-size:13px;font-weight:600;padding:8px 16px;border-radius:20px;z-index:60;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.rg{display:flex;gap:8px;align-items:center}
#snd{display:none!important;border:0;width:32px;height:28px;border-radius:14px;background:#ffffff1c;color:#ffffffcc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
#snd.off{color:#ffffff66}
.island-svg,.isl svg,.monkey svg,#cele svg{stroke:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sterne-Banner oben */
#cele{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border-radius:30px;background:#06240fee;border:1.5px solid #39ff14;box-shadow:0 0 28px #39ff1466,0 8px 24px #0009;animation:cdrop .5s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none;width:max-content;max-width:92%}
@keyframes cdrop{from{transform:translate(-50%,-30px) scale(.8);opacity:0}}
#cele .star{position:relative;width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px #39ff14);animation:spop .7s cubic-bezier(.2,1.7,.4,1) both,spulse 1.6s .7s ease-in-out infinite}
@keyframes spop{from{transform:scale(0) rotate(-140deg)}to{transform:scale(1) rotate(0)}}
@keyframes spulse{50%{transform:scale(1.1) rotate(5deg)}}
#cele .cb{min-width:0}
#cele .ct{font-family:var(--hd);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1;color:#c6ff8a;text-shadow:0 0 12px #39ff14}
#cele .cs{font-size:12px;color:#ffffffcc;line-height:1.35;max-width:210px}
#cele .btn{pointer-events:auto;padding:7px 12px;font-size:12px;flex:none}
.pt{position:absolute;left:33px;top:50%;width:12px;height:12px;margin:-6px;animation:fly 1s ease-out both;pointer-events:none}
.pt svg{width:100%;height:100%}
@keyframes fly{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}

/* Inselkarte */
.psticky{position:static;margin:0 -18px 10px;padding:4px 18px 10px}
.pst{display:flex;gap:8px;margin-top:10px}
.pst div{flex:1;min-width:0;background:var(--panel);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.pst b{font-family:var(--hd);font-size:17px;font-variant-numeric:tabular-nums}
.pst span{font-size:11px;color:var(--mut)}
.map{position:relative;margin:0 -18px -28px;overflow:hidden;background:linear-gradient(#7fd3ff 0,#b9ecff 320px,#46d3d3 780px,#12a6c6 100%)}
.sun{position:absolute;top:34px;right:30px;width:68px;height:68px;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 12px #ffd84a44,0 0 60px 20px #ffe58a99}
.sun::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:repeating-conic-gradient(#fff3a888 0 8deg,#0000 8deg 20deg);-webkit-mask-image:radial-gradient(circle,#0000 36%,#000 38%,#0000 70%);mask-image:radial-gradient(circle,#0000 36%,#000 38%,#0000 70%);animation:spin 40s linear infinite}
.cloud{position:absolute;height:24px;width:88px;border-radius:20px;background:#ffffffd9;animation:drift 42s linear infinite}
.cloud::before{content:"";position:absolute;left:14px;top:-14px;width:38px;height:30px;border-radius:50%;background:#ffffffd9}
@keyframes drift{from{transform:translateX(-130px)}to{transform:translateX(560px)}}
.waves{position:absolute;left:0;right:0;top:320px;bottom:0;opacity:.55;background-image:radial-gradient(ellipse 36px 9px at 50% 100%,#0000 62%,#ffffff99 64% 70%,#0000 72%);background-size:84px 34px;animation:wv 16s linear infinite}
@keyframes wv{to{background-position:-84px 0}}
.shore{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#f8e0a4,#e8c26c);border-top:6px solid #ffffffb8}
.mp{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;stroke:none;fill:none}
.mp path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.mp .todo{stroke:#ffffff88;stroke-width:4;stroke-dasharray:1 11}

ie", "Koffein verkürzt die Müdigkeit der Nacht davor"], ["Was macht Kaffee am Abend meist mit deinem Tiefschlaf?", "Er wird etwas kürzer", "Er wird etwas länger", "Er bleibt immer genau gleich"], ["Du gehst um 23 Uhr ins Bett. Wann sollte die letzte Tasse Kaffee spätestens getrunken sein?", "Um etwa 14 Uhr", "Um etwa 18 Uhr", "Um etwa 21 Uhr"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent mit Quellenliste, danach 3 Runden unabhängige KI-Faktenprüfung (jede Aussage gegen die geöffnete Quelle) und 2 Pädagogik-Reviews", "rounds": 3}, "s": "Koffein", "sources": [{"publisher": "American Academy of Sleep Medicine", "title": "Late afternoon and early evening caffeine can disrupt sleep at night (zu Drake et al. 2013, J Clin Sleep Med)", "url": "https://aasm.org/late-afternoon-and-early-evening-caffeine-can-disrupt-sleep-at-night/"}, {"publisher": "Sleep Medicine Reviews", "title": "The effect of caffeine on subsequent sleep: a systematic review and meta-analysis (Gardiner et al. 2023)", "url": "https://eprints.leedsbeckett.ac.uk/id/eprint/9625/1/TheEffectOfCaffeineOnSubsequentSleepASystematicReviewAndMetaanalysisPV-WEAKLEY.pdf"}, {"publisher": "Bundesinstitut für Risikobewertung (BfR)", "title": "Koffeinhaltige Lebensmittel aus Sicht der Risikobewertung", "url": "https://www.bfr.bund.de/cm/343/koffeinhaltige-lebensmittel-aus-sicht-der-risikobewertung.pdf"}, {"publisher": "PubMed Central", "title": "Adenosine, caffeine, and sleep-wake regulation: state of the science and perspectives", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9541543"}], "status": "approved", "t": "Koffein und Schlaf: Wann der Kaffee dir die Nacht klaut", "ts": 1760000000001}, {"cards": [["🤔", "Muskelkater zu verringern gilt als eines der Hauptziele des Dehnens im Cool-down, und vielleicht dehnst du deshalb auch. Doch Forschende haben die Studien dazu gesammelt und ausgewertet. Was kam heraus?"], ["🧪", "Forschende des Netzwerks Cochrane haben die Studien gebündelt. Ihr Ergebnis: Dehnen vor, nach oder vor und nach dem Sport bringt gesunden Erwachsenen keine klinisch wichtige Linderung von Muskelkater. Nur eine große Studie fand trotzdem einen Effekt. Wie groß war er?"], ["📏", "Diese Studie fand: Wer vor und nach dem Sport dehnte, hatte in der Woche danach beim stärksten Schmerz im Schnitt 4 Punkte weniger auf einer Skala bis 100. Was sagen andere Auswertungen dazu?"], ["🔍", "Eine Übersichtsarbeit von 2021 konnte keinen Unterschied zwischen Dehnen und passiver Erholung, also bloßem Ausruhen, zeigen. Die Daten sind spärlich, das Vertrauen in die Belege sehr gering. Gibt es etwas, das eher helfen könnte?"], ["💆", "Eine Meta-Analyse, also die Auswertung vieler Studien, verglich Erholungsmethoden. Massage schien Muskelkater am besten zu lindern, Dehnen zeigte keinen positiven Effekt. Du kannst nach dem Training deine müden Muskeln massieren. Ein Beweis ist das nicht."]], "id": "dehnen", "k": "Sport", "prod": null, "quiz": [["Du dehnst nach dem Sport, damit der Muskelkater schwächer wird. Was ist laut den ausgewerteten Studien dran?", "Es bringt kaum etwas", "Es hilft deutlich", "Es macht den Muskelkater stärker"], ["Was bedeutet „keine klinisch wichtige Linderung“?", "Du würdest den Unterschied im Alltag kaum spüren", "Dehnen schadet den Muskeln eher als dass es hilft", "Es wirkt nur bei Profis, die jeden Tag trainieren"], ["Eine Studie fand beim Dehnen 4 Punkte weniger Schmerz auf einer Skala bis 100. Wie ist das einzuordnen?", "Ein sehr kleiner Unterschied", "Ein großer Unterschied", "Der Schmerz war fast weg"], ["Was lässt sich über Dehnen im Vergleich zu bloßem Ausruhen sagen?", "Ein Unterschied ließ sich nicht zeigen", "Dehnen ist viel besser als Ausruhen", "Ausruhen ist viel besser als Dehnen"], ["Was schien nach dem Training am ehesten gegen Muskelkater zu helfen?", "Massage", "Dehnen", "Ausruhen auf dem Sofa"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent, unabhängige KI-Faktenprüfung gegen geöffnete Quellen, Pädagogik-Review", "rounds": 3}, "s": "Dehnen", "sources": [{"publisher": "Cochrane", "title": "Stretching to prevent or reduce muscle soreness after exercise", "url": "https://www.cochrane.org/evidence/CD004577_stretching-prevent-or-reduce-muscle-soreness-after-exercise"}, {"publisher": "Frontiers in Physiology / PMC", "title": "An Evidence-Based Approach for Choosing Post-exercise Recovery Techniques (Systematic Review With Meta-Analysis)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5932411"}, {"publisher": "Frontiers in Physiology", "title": "The Effectiveness of Post-exercise Stretching in Short-Term and Delayed Recovery (Systematic Review and Meta-Analysis)", "url": "https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2021.677581/pdf"}], "status": "approved", "t": "Hilft Dehnen gegen Muskelkater?", "ts": 1791391384493}, {"cards": [["🧠", "Du willst jeden Morgen ein Glas Wasser trinken, ganz ohne nachzudenken, wie Zähneputzen. Forschende begleiteten 96 Freiwillige zwölf Wochen lang. Die Antwort unterscheidet sich von Mensch zu Mensch enorm. Wie lange dauert es im Schnitt?"], ["📅", "Im Schnitt dauerte es 66 Tage, bis das Verhalten sich für die Teilnehmenden automatisch anfühlte. Bei einzelnen waren es nur 18 Tage, bei anderen schätzten die Forschenden bis zu 254 Tage. Aber was, wenn du einen Tag verpasst?"], ["🔁", "Ein einzelner verpasster Tag störte den Aufbau laut Studie nicht wesentlich. Die Automatik wuchs danach bald weiter. Ein einzelner Ausrutscher wirft dich also nicht zurück. Aber wie erinnerst du dich jeden Tag an das neue Verhalten?"], ["⚓", "Hänge das neue Verhalten an etwas, das du sowieso tust, zum Beispiel an das Frühstück. Ein solcher Auslöser im Alltag ist laut einem Fachartikel ein bequemer und stabiler Startpunkt. Aber wie machst du daraus einen konkreten Plan?"], ["✍️", "Schreib einen Wenn-dann-Satz: Wenn ich nach dem Frühstück die Tasse abspüle, trinke ich ein Glas Wasser. Eine Auswertung von 94 Tests zeigt: Solche Pläne helfen deutlich dabei, Ziele zu erreichen."]], "id": "habit", "k": "Psyche", "prod": null, "quiz": [["Wie unterschiedlich dauert es von Mensch zu Mensch, bis eine Gewohnheit automatisch läuft?", "Sehr unterschiedlich, von Wochen bis zu vielen Monaten", "Bei allen fast gleich lang, nämlich etwa drei Wochen", "Bei fast allen schon nach wenigen Tagen"], ["Wie lange dauerte es in der Studie im Schnitt, bis das Verhalten automatisch war?", "Gut zwei Monate", "Etwa drei Wochen", "Etwa eine Woche"], ["Du verpasst einen Tag. Was heißt das für deine neue Gewohnheit?", "Nicht schlimm, du machst einfach weiter", "Du musst wieder bei null anfangen", "Die bisherigen Tage sind wertlos"], ["Wie erinnerst du dich am besten an ein neues Verhalten?", "Ich hänge es an etwas, das ich sowieso täglich tue", "Ich nehme mir etwas Großes für nächstes Jahr vor", "Ich warte, bis ich Lust darauf habe"], ["Welcher Satz ist ein Wenn-dann-Plan?", "Wenn ich mittags am Schreibtisch sitze, lese ich zehn Seiten", "Ich nehme mir fest vor, ab jetzt mehr zu lesen", "Ich lese irgendwann im Laufe des Tages zehn Seiten"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent mit Quellenliste, danach 3 Runden unabhängige KI-Faktenprüfung (jede Aussage gegen die geöffnete Quelle) und 2 Pädagogik-Reviews", "rounds": 3}, "s": "Gewohnheiten", "sources": [{"publisher": "European Journal of Social Psychology (Lally, Van Jaarsveld, Potts, Wardle)", "title": "How are habits formed: Modelling habit formation in the real world", "url": "https://doi.org/10.1002/ejsp.674"}, {"publisher": "Advances in Experimental Social Psychology (Gollwitzer, Sheeran), Uni Konstanz", "title": "Implementation Intentions and Goal Achievement: A Meta-analysis of Effects and Processes", "url": "https://kops.uni-konstanz.de/entities/publication/2e749bfb-8533-437c-8203-7e788c910c5f"}, {"publisher": "British Journal of General Practice (Gardner, Lally, Wardle)", "title": "Making health habitual: the psychology of 'habit-formation' and general practice", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3505409"}], "status": "approved", "t": "Wie lange dauert eine neue Gewohnheit?", "ts": 1760000000002}, {"cards": [["🚰", "Du hältst die Hände kurz unter Wasser und fühlst dich sauber. Doch in einer Studie mit 20 Freiwilligen blieben nach dem Waschen nur mit Wasser bei fast jeder vierten Probe Bakterien zurück. Und mit Seife?"], ["🧼", "Mit Seife und Wasser blieben nur 8 Prozent der Proben belastet. Ohne Waschen waren es 44 Prozent, mit Keimen, die aus dem Darm stammen können. Seife half in diesem Versuch deutlich. Aber was macht das Waschen so wirksam?"], ["🔬", "Beim Einschäumen und Reiben entsteht Reibung. Sie hilft, Schmutz, Fett und Mikroben von der Haut zu lösen, wie beim Abwischen eines fettigen Tellers. Deine Hände leisten also einen Teil der Arbeit. Aber muss das Wasser dafür warm sein?"], ["🌡️", "Nein. Die Wassertemperatur scheint nicht zu beeinflussen, wie viele Keime verschwinden. Warmes Wasser kann die Haut sogar stärker reizen. Doch wie lange solltest du die Hände waschen?"], ["⏱️", "Nimm Seife, schäume die Hände ein und reibe sie etwa 15 bis 30 Sekunden. Die US-Gesundheitsbehörde CDC schreibt, die Evidenz deute darauf hin, dass das mehr Keime entfernt als kürzeres Waschen. Welche Wassertemperatur du nimmst, ist dafür offenbar egal."]], "id": "haende", "k": "Gesundheit", "prod": null, "quiz": [["Du hältst die Hände nur kurz unter Wasser. Wie sauber sind sie dann?", "Oft nicht ganz sauber, Bakterien blieben häufig zurück", "Zuverlässig keimfrei, Wasser reicht völlig aus", "Sauberer als nach dem Waschen mit Seife"], ["Was bringt Seife beim Händewaschen?", "Deutlich weniger Keime als mit Wasser allein", "Sie macht es angenehmer, ändert aber nichts", "Sie entfernt nur den Geruch"], ["Wie entfernt das Einschäumen Schmutz und Keime?", "Durch die Reibung beim Reiben der Hände", "Durch den Duft, der Keime vertreibt", "Durch die Wärme, die Keime abtötet"], ["Muss das Wasser warm sein, damit Händewaschen wirkt?", "Nein, die Temperatur macht offenbar keinen Unterschied", "Ja, möglichst heiß, weil das Keime abtötet", "Ja, möglichst kalt, weil Seife dann besser wirkt"], ["Wie lange solltest du die Hände mit Seife reiben?", "Etwa 15 bis 30 Sekunden", "Etwa 3 Sekunden", "Mindestens 5 Minuten"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent, unabhängige KI-Faktenprüfung gegen geöffnete Quellen, Pädagogik-Review", "rounds": 3}, "s": "Händewaschen", "sources": [{"publisher": "Int J Environ Res Public Health (PMC)", "title": "The Effect of Handwashing with Water or Soap on Bacterial Contamination of Hands", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3037063"}, {"publisher": "CDC", "title": "Show Me the Science: How to Wash Your Hands", "url": "https://www.cdc.gov/handwashing/show-me-the-science-handwashing.html"}], "status": "approved", "t": "Händewaschen: Was macht es wirklich wirksam?", "ts": 1791391769950}, {"cards": [["🌤️", "Der Himmel ist blau, obwohl dort oben nur Luft ist. Kein Dach, keine Farbe zum Anfassen. Woher kommt das Blau also? Es hat mit winzigen Teilchen zu tun, die du nie siehst. Aber was machen sie mit dem Licht?"], ["☀️", "Sonnenlicht prallt an den Gasmolekülen der Atmosphäre ab und wird gestreut, ähnlich wie ein Ball, der von etwas abprallt. Dieses Streuen heißt Rayleigh-Streuung. Doch warum bleibt dabei ausgerechnet Blau übrig und nicht Gelb oder Rot?"], ["🌊", "Licht besteht aus Wellen verschiedener Länge. Blaues Licht hat kurze, kleine Wellen und wird deshalb stärker gestreut als andere Farben. Aber Violett hat noch kürzere Wellen als Blau. Warum siehst du dann keinen violetten Himmel?"], ["👁️", "Ein Teil des Violetts wird in der oberen Atmosphäre aufgenommen. Außerdem sind deine Augen für Blau empfindlicher als für Violett. Darum siehst du Blau. Aber warum färbt sich derselbe Himmel abends plötzlich rot und gelb?"], ["🌅", "Bei tiefem Sonnenstand durchquert das Licht mehr Atmosphäre. Mehr Blau und Violett wird weggestreut, Rot und Gelb kommen durch. Achte beim nächsten Sonnenuntergang auf die Farben am Himmel. Du siehst dieselbe Streuung, nur mit längerem Weg."]], "id": "himmel", "k": "Wissenschaft", "prod": null, "quiz": [["Woher kommt das Blau des Himmels?", "Von gestreutem Sonnenlicht in der Luft", "Von einem blauen Gas hoch oben in der Luft", "Von der Spiegelung der Meere auf der Erde"], ["Was passiert mit dem Sonnenlicht in der Atmosphäre?", "Es prallt an Luftteilchen ab und streut in alle Richtungen", "Es wird von der Luft komplett aufgesaugt und bleibt dort", "Es wird beim Durchgang wie durch Glas blau eingefärbt"], ["Warum sehen wir mehr Blau als Rot?", "Blaues Licht hat kürzere Wellen und wird stärker gestreut", "Blau ist die hellste Farbe im Sonnenlicht und fällt auf", "Rotes Licht wird in der Luft fast ganz verschluckt"], ["Warum ist der Himmel blau und nicht violett?", "Unsere Augen sehen Blau besser als Violett", "Violett gibt es im Sonnenlicht praktisch nicht", "Violett wird in der Luft überhaupt nicht gestreut"], ["Warum wird der Himmel abends rot?", "Das Licht muss weiter durch die Luft, Blau wird dabei weggestreut", "Die Sonne wird abends kälter und leuchtet deshalb rot", "Abends ist mehr rotes Gas in der Luft als tagsüber"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent, unabhängige KI-Faktenprüfung gegen geöffnete Quellen, Pädagogik-Review", "rounds": 1}, "s": "Blauer Himmel", "sources": [{"publisher": "NOAA NESDIS", "title": "Why is the sky blue?", "url": "https://www.nesdis.noaa.gov/about/k-12-education/atmosphere/why-the-sky-blue"}, {"publisher": "National Weather Service (NOAA)", "title": "Why the Sky is Blue", "url": "https://www.weather.gov/fgz/SkyBlue"}, {"publisher": "HyperPhysics, Georgia State University", "title": "Blue Sky and Rayleigh Scattering", "url": "https://hyperphysics.gsu.edu/hbase/atmos/blusky.html"}], "status": "approved", "t": "Warum ist der Himmel blau?", "ts": 1791391769949}, {"cards": [["🚿", "Du drehst morgens auf kalt und hoffst auf weniger Krankheitstage und weniger Stress. Forschende haben das mit zufällig eingeteilten Gruppen getestet. Hält die kalte Dusche, was sie verspricht? Schau zuerst auf die Fehltage."], ["🤒", "Wer kalt duschte, meldete 29 Prozent weniger Fehltage bei der Arbeit. Aber wie viele Tage die Menschen wirklich krank waren, unterschied sich nicht deutlich. Die Fehltage sind selbst berichtet. Was weiß man über den Körper direkt nach dem Reiz?"], ["🔥", "Direkt nach kaltem Wasser stieg in einer Übersichtsarbeit, also einer Auswertung vieler Studien, ein Entzündungsmarker an. Die Autoren nennen das eine akute Entzündungsreaktion auf den Reiz. Und was ist mit deinem Stress?"], ["😌", "Direkt nach dem kalten Wasser fand man keinen klaren Effekt auf den Stress, auch nach einer, 24 und 48 Stunden nicht. Nur nach etwa 12 Stunden sank er deutlich. Wie belastbar ist das alles?"], ["✅", "Die Beweislage ist dünn: wenige Studien, kleine Gruppen, meist Kältebäder statt Duschen. Willst du es trotzdem testen, dusche warm und drehe am Ende auf kalt. In der Dusch-Studie spürten manche danach länger Kälte am Körper oder an Händen und Füßen."]], "id": "kaltdu", "k": "Gesundheit", "prod": null, "quiz": [["Macht kaltes Duschen am Morgen dich laut Studien wirklich seltener krank?", "Das konnte nicht klar gezeigt werden", "Ja, deutlich seltener", "Nein, du wirst deutlich häufiger krank"], ["Kaltduscher meldeten 29 Prozent weniger Fehltage. Warum heißt das nicht automatisch, dass sie gesünder waren?", "Tatsächlich krank waren sie nicht deutlich seltener", "In Wahrheit waren sie sogar häufiger krank als andere", "Die Studie dauerte nur wenige Tage, das war zu kurz"], ["Was passiert direkt nach kaltem Wasser in deinem Körper?", "Er reagiert kurz mit einer Entzündungsreaktion", "Er heilt vorhandene Entzündungen sofort", "Er schaltet die Abwehrzellen ab"], ["Hilft kaltes Wasser sofort gegen Stress?", "Nicht sofort, erst nach etwa 12 Stunden sank der Stress", "Ja, der Stress ist schon beim Abtrocknen deutlich geringer", "Nein, es erhöht den Stress dauerhaft über Tage hinweg"], ["Du willst die kalte Dusche trotzdem testen. Wie kommst du am sanftesten hinein?", "Warm duschen und am Ende kalt aufdrehen", "Direkt eiskalt starten", "Erst ein langes Eisbad nehmen"]], "review": {"date": "2026-10-07", "facts": "pass", "method": "Autor-Agent, unabhängige KI-Faktenprüfung gegen geöffnete Quellen, Pädagogik-Review", "rounds": 2}, "s": "Kalt duschen", "sources": [{"publisher": "PLOS ONE (2025)", "title": "Effects of cold-water immersion on health and wellbeing: A systematic review and meta-analysis", "url": "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0317615"}, {"publisher": "PLOS ONE (2016)", "title": "Effect of Cold Showering on Health and Work: A Randomized Controlled Trial", "url": "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0161749"}], "status": "approved", "t": "Kalt duschen am Morgen: Was ist wissenschaftlich dran?", "ts": 1791391384491}, {"cards": [["🌙", "Du paukst bis spät und schläfst dann ein. Klingt wie verlorene Lernzeit. Forschende beschreiben aber, dass Schlaf wesentlich dazu beiträgt, dass Gelerntes dauerhaft im Gehirn bleibt. Aber in welcher Phase passiert das?"], ["🌊", "Für Fakten, die du dir merken willst, hat der Tiefschlaf laut einer Übersichtsarbeit den größten förderlichen Effekt. Das ist die tiefste Schlafphase. Stell dir eine Nachtschicht für dein Gedächtnis vor. Aber was macht das Gehirn dabei?"], ["🔁", "Im Schlaf wird neu Gelerntes im Gehirn erneut aktiviert, wie eine stille Wiederholung. Die Idee dahinter: So wird die Spur der Erinnerung stärker und verändert sich. Aber wohin wandert so eine Erinnerung?"], ["🏠", "Einer Theorie zufolge zieht die Erinnerung im Schlaf um: vom Hippocampus, einer Art Zwischenspeicher, in die Großhirnrinde, wo Wissen lange bleibt. Wie vom Notizzettel ins Archiv. Aber was, wenn dir Schlaf vor dem Lernen fehlt?"], ["😴", "I const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const REV_MS=2*36e5;
function dueIds(){return (S.rev||[]).filter(e=>e.due<=nowMs()&&byId[e.id]&&QZ[e.id]).map(e=>e.id);}
function nextRevMs(){const f=(S.rev||[]).filter(e=>e.due>nowMs()&&byId[e.id]).map(e=>e.due-nowMs());return f.length?Math.min.apply(null,f):0;}
const fmtIn=ms=>{const m=Math.max(1,Math.round(ms/6e4));return m>=60?Math.floor(m/60)+' Std. '+(m%60?m%60+' Min.':''):m+' Min.';};
function queueRev(d){
 const ids=d.cards.map((_,i)=>d.id+(i+1)).filter(id=>QZ[id]&&byId[id]);if(!ids.length)return null;
 const id=ids[Math.floor(Math.random()*ids.length)];
 if(!S.rev.some(e=>e.id===id)){S.rev.push({id:id,d:d.id,ph:0,due:nowMs()});if(S.rev.length>30)S.rev=S.rev.slice(-30);}
 return id;
}
function revUpdate(id,ok){
 const e=(S.rev||[]).find(x=>x.id===id);if(!e)return;
 qz.last={ph:e.ph,ok:ok};
 if(e.ph===0){e.ph=1;e.due=nowMs()+REV_MS;}
 else{S.rev=S.rev.filter(x=>x!==e);S.asked=(S.asked||0)+1;if(ok)S.kept=(S.kept||0)+1;}
}

function ding(ok){
 if(!soundOn)return;const a=audioCtx();if(!a)return;const t=a.currentTime+0.01;
 if(ok){note(880,t,0.12,'triangle',0.08);note(1318.5,t+0.08,0.22,'triangle',0.08);}
 else{note(170,t,0.28,'sawtooth',0.05);}
}
function sweepRaw(f1,f2,t,d,type,v){
 const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);
}
function noiseB(t,d,v,f,f2){
 const a=AC,n=Math.max(1,Math.floor(a.sampleRate*d)),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
 for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
 const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.Q.value=1.2;
 fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*0.2);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);
}
/* Tiergeräusche: Affe, Hund, Einhorn */
function sfx(k,an){
 if(!soundOn)return;const a=audioCtx();if(!a)return;const t=a.currentTime+0.02;an=an||0;
 const sweep=(f1,f2,tt,d,ty,v)=>{sweepRaw(f1*.8,f2*.8,tt,d*1.25,'sine',v*.7);sweepRaw(f1*1.6,f2*1.6,tt,d*1.1,'sine',v*.14);};
 if(k==='happy'||k==='cheer'){
  if(an===0){sweep(500,820,t,.1,'triangle',.1);sweep(620,980,t+.13,.1,'triangle',.1);sweep(720,1250,t+.26,.2,'triangle',.1);}
  else if(an===1){sweep(950,520,t,.09,'sawtooth',.05);sweep(1050,560,t+.15,.1,'sawtooth',.05);}
  else{sweep(700,1500,t,.14,'sawtooth',.03);sweep(1500,650,t+.14,.3,'sawtooth',.03);[1318.5,1568,1975.5,2637].forEach((f,i)=>note(f,t+.3+i*.1,.45,'sine',.025));}
 }else if(k==='sad'){
  sweep(620,330,t,.4,'triangle',.08);sweep(560,260,t+.5,.5,'triangle',.07);
 }else if(k==='munch'){
  for(let i=0;i<3;i++){noiseB(t+i*.16,.1,.035,520+i*80);note(150,t+i*.16,.09,'sine',.04);}
 }else if(k==='upgrade'){
  noiseB(t,.7,.03,400,2200);[523.25,659.25,783.99,1046.5].forEach((f,i)=>{note(f,t+.3+i*.12,.5,'sine',.06);note(f*2,t+.3+i*.12,.4,'sine',.015);});setTimeout(()=>sfx('happy',an),900);
 }else if(k==='demote'){
  [440,392,349,294].forEach((f,i)=>note(f,t+i*.22,.4,'sine',.06));
 }
}

}

 if(!gm)return;

  const k=+b.dataset.gb,o=gm.opts[k];gm.sel=k;gm.n++;
  if(o.r){gm.right++;gm.combo++;gm.maxc=Math.max(gm.maxc,gm.combo);gm.score+=10+Math.min(gm.combo-1,10)*2;ding(true);}else{gm.combo=0;ding(false);}
  renderGame();
  const g=gm;setTimeout(()=>{if(gm!==g||g.done)return;g.i++;g.sel=-1;g.opts=null;renderGame();},o.r?350:1000);
  return;
 }
 const bo=e.target.closest('[data-gbo]');
 if(bo&&gm.kind==='boss'&&!gm.done&&gm.sel<0){
  const k=+bo.dataset.gbo,o=gm.opts[k];gm.sel=k;gm.n++;
  if(o.r){gm.right++;gm.hp--;ding(true);}else{gm.lives--;ding(false);}
  renderGame();const g=gm;
  setTimeout(()=>{if(gm!==g||g.done)return;if(g.hp<=0){endBoss(true);return;}if(g.lives<=0){endBoss(false);return;}g.i++;g.sel=-1;g.opts=null;renderGame();},o.r?450:1100);
  return;
 }
 const t=e.target.closest('[data-gtf]');
 if(t&&gm.kind==='tf'&&!gm.done&&gm.sel<0){
  const it=gm.items[gm.i];gm.sel=+t.dataset.gtf;const ok=(gm.sel===1)===it.truth;
  if(ok){gm.ok++;S.xp+=5;S.shells+=1;ding(true);}else ding(false);
  save();syncBadges();renderGame();return;
 }
 if(e.target.closest('[data-gnext]')&&gm.kind==='tf'){

 }
});

/* Serienschutz */
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function applyFreeze(){
 if(!S.goalDay||S.streak<1)return;
 const gap=daysBetween(S.goalDay,yest());
 if(gap>0&&gap<=S.freezes){S.freezes-=gap;S.goalDay=yest();const left=S.freezes;setTimeout(()=>{toast('Serienschutz hat deine Serie gerettet ('+left+' übrig)');},700);}
}

 else if(k==='unidel'){if(confirm('Alle Uni-Decks von diesem Gerät löschen?')){try{localStorage.removeItem(UNI_KEY);localStorage.removeItem('dm_uni_mode');}catch(x){}location.reload();}}

function uniStore(l){
 const ok=l.filter(okDeck).slice(0,500).map(d=>Object.assign({},d,{uni:true}));
 if(!ok.length){toast('Keine gültigen Decks gefunden');return;}
 const all=mergeDecks(uniDecks(),ok);localStorage.setItem(UNI_KEY,JSON.stringify(all));localStorage.setItem('dm_uni_mode','1');
 toast(ok.length+' Uni-Decks importiert');setTimeout(()=>location.reload(),900);
}
async function uniCloud(){
 const pw=prompt('Uni-Passwort:');if(!pw)return;
 try{
  const j=await (await fetch('uni.enc',{cache:'no-store'})).json();
  const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(j.s),iterations:j.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(j.n)},k,u(j.c));
  const l=JSON.parse(new TextDecoder().decode(pt));if(!Array.isArray(l))throw 0;uniStore(l);
 }catch(x){toast('Passwort falsch oder Datei nicht erreichbar');}
}

});

let tx0=0,ty0=0,tT0=0,tOn=false,tLock=false;
const BACK_K=1,FWD_MIN=55,BACK_MIN=55;
function swStart(x,y,t){
 tx0=x;ty0=y;tT0=Date.now();tLock=false;tOn=!swBusy&&!(t&&t.closest&&t.closest('a,button'));}
function swMove(x,y){
 if(!tOn)return;const dx=x-tx0,dy=y-ty0;
 if(!tLock){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*.9)tLock=true;else{if(Math.abs(dy)>36&&Math.abs(dy)>Math.abs(dx)*1.6)tOn=false;return;}}
 if(dx<-FWD_MIN||dx>BACK_MIN){tOn=false;tLock=false;swipeDeck(dx<0?1:-1);}
}
function swEnd(x,y){
 if(!tOn)return;tOn=false;
 const dx=x-tx0,dy=y-ty0,f=$('#feed'),v=Math.abs(dx)/Math.max(1,Date.now()-tT0);
 if(!tLock)return;tLock=false;
 const fwd=dx<-FWD_MIN||(dx<-28&&v>.5),back=dx>BACK_MIN||(dx>28&&v>.5);
 if(fwd||back){
  /* Weiterwischen: kurz und leicht; zurück: nur mit langem, bewusstem Wisch */
  swipeDeck(fwd?1:-1);
 }
}
let whX=0,whT=0,whL=0;

 if(view!=='feed'||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;

 if(t<whL)return;if(Math.abs(whX)>70&&!swBusy){const d=whX>0?1:-1;whX=0;whL=t+800;swipeDeck(d);}
},{passive:false});

function swReset(){tOn=false;tLock=false;}
$('#feed').addEventListener('touchcancel',swReset,{passive:true});
$('#feed').addEventListener('touchend',e=>{const t=e.changedTouches[0];swEnd(t.clientX,t.clientY);},{passive:true});
$('#feed').addEventListener('mousedown',e=>swStart(e.clientX,e.clientY,e.target));

let db=null,user=null,uid=null,people=[],canWrite=true,syncing=false,dirty=false,syncTimer=null;
function schedSync(){if(!db||!uid||!canWrite)return;clearTimeout(syncTimer);syncTimer=setTimeout(doSync,1500);}
async function doSync(){
 if(syncing){dirty=true;return;}
 syncing=true;
 try{
  await db.doc('data/users/'+uid+'/state').set({s:S});
  await db.doc('people/'+uid).set({
   lvl:S.level,xp:S.xp,st:S.streak,gd:S.goalDay,wr:wrOf(),pf:S.prefs||[],af:S.aff||{},
   pub:S.folders.filter(f=>f.pub).map(f=>({id:f.id,n:f.name,c:f.cards}))
  });
 }catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='quota_exceeded'))canWrite=false;}
 syncing=false;
 if(dirty&&canWrite){dirty=false;schedSync();}
}
async function initCloud(){
 try{
  const cl=window.claude;if(!cl||!cl.use)return;
  user=await cl.use('user');db=await cl.use('db');
  if(!user||!db){db=null;return;}
  uid=await user.id();if(!uid){db=null;return;}
  try{
   const snap=await db.doc('data/users/'+uid+'/state').get();
   if(snap.exists){const r=snap.data().s;if(r&&r.ts>S.ts){S=Object.assign(S,JSON.parse(JSON.stringify(r)));fixFolders();if(S.onb)hideOnb();rollDay();persistLocal();syncFeed();if(view==='lib')renderLib();if(view==='prog')renderProg();}}
  }catch(e){}
  if(isOwner()){try{db.collection('topics').onSnapshot(snap=>{topics=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(view==='disc'&&!discOpen)renderDisc();},()=>{});}catch(e){}}
  try{db.collection('decks').onSnapshot(snap=>{try{const l=snap.docs.map(d=>d.data());deckSync.n=l.length;deckSync.err='';applyRemote(l);}catch(e){deckSync.err=String(e&&e.message||e).slice(0,80);}if(view==='disc'&&!discOpen)renderDisc();},e=>{deckSync.err=String(e&&(e.code||e.message)||'unbekannt').slice(0,80);if(view==='disc'&&!discOpen)renderDisc();});}catch(e){deckSync.err=String(e&&e.message||e).slice(0,80);}
  let first=true;
  db.collection('people').onSnapshot(snap=>{
   people=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
   if(first){first=false;if(!people.some(p=>p.id===uid)&&S.ts)schedSync();}
   if(view==='prog'&&progTab==='stats')renderStats();else if(view==='disc')renderDisc();
  },()=>{});
 }catch(e){}
}
